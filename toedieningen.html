<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuukData - Toedieningen & Extra's</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2, h3 {
            color: #28a745;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 18px;
            background: #fafafa;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .counter-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .counter-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .counter-btn {
            background-color: #0066cc;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .counter-btn:hover { background-color: #004fa3; }
        .counter-value {
            font-size: 18px;
            font-weight: bold;
            width: 30px;
            text-align: center;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            font-size: 16px;
        }
        .radio-group label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        select[multiple] {
            width: 100%;
            height: 110px;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 15px;
        }
        .dropdown-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .small-btn {
            padding: 6px 12px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            font-weight: bold;
        }
        .btn-add-opt { background-color: #17a2b8; color: white; }
        .btn-add-opt:hover { background-color: #138496; }
        .btn-del-opt { background-color: #dc3545; color: white; }
        .btn-del-opt:hover { background-color: #c82333; }

        button.main-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button.main-btn:hover { background-color: #218838; }
        .btn-edit {
            background-color: #ffc107;
            color: #333;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th { background-color: #28a745; color: white; }
        #bewerkModeBanner {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💊 Toedieningen & Metingen</h2>
        
        <div id="bewerkModeBanner">
            Bewerkmodus actief <button onclick="annuleerBewerken()" style="padding: 2px 5px; font-size: 12px; width: auto; background: #dc3545; margin-top:0; border:none; color:white; border-radius:4px;">Annuleer</button>
        </div>

        <input type="hidden" id="editRowIndex" value="">
        <input type="hidden" id="oorspronkelijkeDatum" value="">

        <!-- Fragmin 2500 -->
        <div class="form-group">
            <div class="counter-box">
                <label style="margin:0;">Fragmin 2500:</label>
                <div class="counter-controls">
                    <button type="button" class="counter-btn" onclick="wijzigTeller('fragmin2500', -1)">-</button>
                    <span id="fragmin2500" class="counter-value">0</span>
                    <button type="button" class="counter-btn" onclick="wijzigTeller('fragmin2500', 1)">+</button>
                </div>
            </div>
        </div>

        <!-- Fragmin 5000 -->
        <div class="form-group">
            <div class="counter-box">
                <label style="margin:0;">Fragmin 5000:</label>
                <div class="counter-controls">
                    <button type="button" class="counter-btn" onclick="wijzigTeller('fragmin5000', -1)">-</button>
                    <span id="fragmin5000" class="counter-value">0</span>
                    <button type="button" class="counter-btn" onclick="wijzigTeller('fragmin5000', 1)">+</button>
                </div>
            </div>
        </div>

        <!-- IJzer J/N -->
        <div class="form-group">
            <label>IJzer:</label>
            <div class="radio-group">
                <label><input type="radio" name="ijzer" value="Ja"> Ja</label>
                <label><input type="radio" name="ijzer" value="Nee" checked> Nee</label>
            </div>
        </div>

        <!-- Epo J/N -->
        <div class="form-group">
            <label>Epo:</label>
            <div class="radio-group">
                <label><input type="radio" name="epo" value="Ja"> Ja</label>
                <label><input type="radio" name="epo" value="Nee" checked> Nee</label>
            </div>
        </div>

        <!-- Shuntflowmeting J/N + 4-digit input -->
        <div class="form-group">
            <label>Shuntflowmeting:</label>
            <div class="radio-group" style="margin-bottom: 10px;">
                <label><input type="radio" name="shuntChoice" value="Ja" onclick="toggleShuntInput(true)"> Ja</label>
                <label><input type="radio" name="shuntChoice" value="Nee" onclick="toggleShuntInput(false)" checked> Nee</label>
            </div>
            <div id="shuntInputContainer" style="display: none;">
                <label for="shuntWaarde" style="font-size: 14px; font-weight: normal;">Waarde (max 4 cijfers):</label>
                <input type="text" id="shuntWaarde" maxlength="4" placeholder="Bijv. 1250">
            </div>
        </div>

        <!-- Multi-select met toevoeg en verwijder knoppen -->
        <div class="form-group">
            <label for="multiSelectOpties">Extra items / Selectie (Multi-select: houd Ctrl ingedrukt):</label>
            <select id="multiSelectOpties" multiple>
                <option value="" disabled>Laden vanuit Google Sheet...</option>
            </select>
            <div class="dropdown-actions">
                <button type="button" class="small-btn btn-add-opt" onclick="voegNieuweOptieToe()">+ Nieuwe optie toevoegen</button>
                <button type="button" class="small-btn btn-del-opt" onclick="verwijderGeselecteerdeOptie()">🗑️ Verwijder gekozen optie</button>
            </div>
        </div>

        <div class="form-group">
            <label for="opmerking">Opmerkingen:</label>
            <textarea id="opmerking" rows="2" placeholder="Bijzonderheden..."></textarea>
        </div>

        <button id="opslaanBtn" class="main-btn" onclick="dataOpslaan()">Opslaan naar Google Sheet</button>

        <a href="index.html" class="back-link">← Terug naar Hoofdmenu</a>
    </div>

    <div class="container">
        <h3>📊 Geschiedenis Toedieningen</h3>
        <button onclick="laadOverzicht()" style="background-color: #0066cc; margin-top: 5px; margin-bottom: 15px; padding: 10px; font-size: 14px; color:white; border:none; border-radius:6px; cursor:pointer;">Gegevens ophalen uit Google Sheet</button>
        <div style="overflow-x: auto;">
            <table id="overzichtTable">
                <thead>
                    <tr>
                        <th>Datum / Tijd</th>
                        <th>F2500</th>
                        <th>F5000</th>
                        <th>IJzer</th>
                        <th>Epo</th>
                        <th>Shunt</th>
                        <th>Extra's</th>
                        <th>Opmerking</th>
                        <th>Actie</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="9">Klik op de knop hierboven om overzicht te laden.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxudGZYXVLm1vN1Wj4BZydsJCiDnzaEBC0BedDQpkvgNfGrcAZ_vszquiO4byM29_wQ/exec";
        let alleRijenData = [];

        window.onload = function() {
            laadDropdownOpties();
            laadOverzicht();
        };

        function wijzigTeller(id, delta) {
            let el = document.getElementById(id);
            let val = parseInt(el.innerText) + delta;
            if (val < 0) val = 0;
            el.innerText = val;
        }

        function toggleShuntInput(toon) {
            document.getElementById('shuntInputContainer').style.display = toon ? 'block' : 'none';
            if (!toon) document.getElementById('shuntWaarde').value = '';
        }

        function laadDropdownOpties() {
            fetch(SCRIPT_URL + "?action=getOptions")
            .then(res => res.json())
            .then(result => {
                let select = document.getElementById('multiSelectOpties');
                select.innerHTML = "";
                if (result.status === "success" && result.data.length > 0) {
                    result.data.forEach(optie => {
                        let opt = document.createElement('option');
                        opt.value = optie;
                        opt.innerText = optie;
                        select.appendChild(opt);
                    });
                } else {
                    select.innerHTML = '<option value="" disabled>Geen opties gevonden. Voeg er een toe!</option>';
                }
            })
            .catch(err => {
                console.error("Fout bij laden opties", err);
            });
        }

        function voegNieuweOptieToe() {
            let nieuweOptie = prompt("Typ de naam van de nieuwe optie die je wilt toevoegen:");
            if (!nieuweOptie || nieuweOptie.trim() === "") return;
            
            nieuweOptie = nieuweOptie.trim();

            // Stuur naar Google Sheet om op te slaan in het tabblad 'Opties'
            let data = {
                sheetName: "Opties",
                NieuweOptie: nieuweOptie
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert("Optie toegevoegd!");
                setTimeout(laadDropdownOpties, 1500); // Herlaad lijst na 1.5 sec
            })
            .catch(err => {
                console.error("Fout:", err);
                alert("Kon optie niet toevoegen.");
            });
        }

        function verwijderGeselecteerdeOptie() {
            let select = document.getElementById('multiSelectOpties');
            let geselecteerd = Array.from(select.selectedOptions).map(opt => opt.value);
            
            if (geselecteerd.length === 0) {
                alert("Selecteer eerst de optie(s) in de lijst die je wilt verwijderen!");
                return;
            }

            if (!confirm("Weet je zeker dat je deze geselecteerde optie(s) wilt verwijderen uit de lijst?")) return;

            let data = {
                sheetName: "Opties",
                VerwijderOpties: geselecteerd.join("|||")
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert("Optie(s) verwijderd!");
                setTimeout(laadDropdownOpties, 1500);
            })
            .catch(err => {
                console.error("Fout:", err);
                alert("Kon optie niet verwijderen.");
            });
        }

        function dataOpslaan() {
            let f2500 = document.getElementById('fragmin2500').innerText;
            let f5000 = document.getElementById('fragmin5000').innerText;
            let ijzer = document.querySelector('input[name="ijzer"]:checked').value;
            let epo = document.querySelector('input[name="epo"]:checked').value;
            
            let shuntChoice = document.querySelector('input[name="shuntChoice"]:checked').value;
            let shuntVal = shuntChoice === "Ja" ? document.getElementById('shuntWaarde').value : "Nee";
            
            let selectElement = document.getElementById('multiSelectOpties');
            let geselecteerd = Array.from(selectElement.selectedOptions).map(opt => opt.value).join(', ');

            let opmerking = document.getElementById('opmerking').value;
            let rowIndex = document.getElementById('editRowIndex').value;
            let bestaandeDatum = document.getElementById('oorspronkelijkeDatum').value;

            let nu = new Date();
            let datumTijdStr = bestaandeDatum ? bestaandeDatum : 
                String(nu.getDate()).padStart(2, '0') + '-' + 
                String(nu.getMonth() + 1).padStart(2, '0') + '-' + 
                nu.getFullYear() + ' ' + 
                String(nu.getHours()).padStart(2, '0') + ':' + 
                String(nu.getMinutes()).padStart(2, '0');

            let data = {
                sheetName: "Toedieningen",
                DatumTijd: datumTijdStr,
                Fragmin2500: f2500,
                Fragmin5000: f5000,
                IJzer: ijzer,
                Epo: epo,
                Shuntflow: shuntVal,
                ExtraSelectie: geselecteerd,
                Opmerking: opmerking
            };

            if (rowIndex) data.rowIndex = rowIndex;

            alert("Bezig met opslaan...");

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert("Succesvol opgeslagen!");
                annuleerBewerken();
                setTimeout(laadOverzicht, 1500);
            })
            .catch(error => {
                console.error('Fout:', error);
                alert("Er ging iets mis bij het opslaan.");
            });
        }

        function laadOverzicht() {
            fetch(SCRIPT_URL + "?action=getData&sheet=Toedieningen")
            .then(response => response.json())
            .then(result => {
                if (result.status === "success" && result.data.length > 0) {
                    alleRijenData = result.data;
                    let tbody = document.getElementById('tableBody');
                    tbody.innerHTML = "";
                    
                    let rows = [...result.data].reverse();

                    rows.forEach(row => {
                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${row.DatumTijd || ''}</td>
                            <td>${row.Fragmin2500 || 0}</td>
                            <td>${row.Fragmin5000 || 0}</td>
                            <td>${row.IJzer || ''}</td>
                            <td>${row.Epo || ''}</td>
                            <td>${row.Shuntflow || ''}</td>
                            <td>${row.ExtraSelectie || ''}</td>
                            <td>${row.Opmerking || ''}</td>
                            <td><button class="btn-edit" onclick="laadRijVoorBewerking(${row.rowIndex})">Bewerk</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            })
            .catch(err => {
                console.error("Kon overzicht niet laden", err);
            });
        }

        function laadRijVoorBewerking(rowIndex) {
            let rij = alleRijenData.find(r => r.rowIndex == rowIndex);
            if (!rij) return;

            document.getElementById('editRowIndex').value = rij.rowIndex;
            document.getElementById('oorspronkelijkeDatum').value = rij.DatumTijd;
            document.getElementById('fragmin2500').innerText = rij.Fragmin2500 || 0;
            document.getElementById('fragmin5000').innerText = rij.Fragmin5000 || 0;
            
            document.querySelector(`input[name="ijzer"][value="${rij.IJzer || 'Nee'}"]`).checked = true;
            document.querySelector(`input[name="epo"][value="${rij.Epo || 'Nee'}"]`).checked = true;
            
            if (rij.Shuntflow && rij.Shuntflow !== "Nee") {
                document.querySelector('input[name="shuntChoice"][value="Ja"]').checked = true;
                toggleShuntInput(true);
                document.getElementById('shuntWaarde').value = rij.Shuntflow;
            } else {
                document.querySelector('input[name="shuntChoice"][value="Nee"]').checked = true;
                toggleShuntInput(false);
            }

            document.getElementById('opmerking').value = rij.Opmerking || '';
            
            document.getElementById('bewerkModeBanner').style.display = 'block';
            document.getElementById('opslaanBtn').innerText = "Wijzigingen Opslaan";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function annuleerBewerken() {
            document.getElementById('editRowIndex').value = "";
            document.getElementById('oorspronkelijkeDatum').value = "";
            document.getElementById('bewerkModeBanner').style.display = 'none';
            document.getElementById('opslaanBtn').innerText = "Opslaan naar Google Sheet";
            document.getElementById('fragmin2500').innerText = "0";
            document.getElementById('fragmin5000').innerText = "0";
            document.getElementById('opmerking').value = "";
            toggleShuntInput(false);
        }
    </script>

</body>
</html>
