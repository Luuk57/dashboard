<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuukData - Toedieningen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2, h3 {
            color: #28a745;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #218838;
        }
        .btn-edit {
            background-color: #ffc107;
            color: #333;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #28a745;
            color: white;
        }
        #bewerkModeBanner {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💊 Toedieningen Beheer</h2>
        
        <div id="bewerkModeBanner">
            Bewerkmodus actief <button onclick="annuleerBewerken()" style="padding: 2px 5px; font-size: 12px; width: auto; background: #dc3545; margin-top:0;">Annuleer</button>
        </div>

        <input type="hidden" id="editRowIndex" value="">
        <input type="hidden" id="oorspronkelijkeDatum" value="">

        <div class="form-group">
            <label for="typeToediening">Type toediening / Medicatie:</label>
            <select id="typeToediening">
                <option value="Zoutoplossing / NaCl">Zoutoplossing / NaCl</option>
                <option value="Medicatie / Injectie">Medicatie / Injectie</option>
                <option value="Spoeling">Spoeling</option>
                <option value="Anders">Anders</option>
            </select>
        </div>

        <div class="form-group">
            <label for="hoeveelheid">Hoeveelheid / Dosering:</label>
            <input type="text" id="hoeveelheid" placeholder="Bijv. 100 ml of 2 tabletten">
        </div>

        <div class="form-group">
            <label for="opmerking">Opmerkingen:</label>
            <textarea id="opmerking" rows="3" placeholder="Eventuele bijzonderheden..."></textarea>
        </div>

        <button id="opslaanBtn" onclick="dataOpslaan()">Opslaan naar Google Sheet</button>

        <a href="index.html" class="back-link">← Terug naar Hoofdmenu</a>
    </div>

    <div class="container">
        <h3>📊 Geschiedenis Toedieningen</h3>
        <button onclick="laadOverzicht()" style="background-color: #0066cc; margin-top: 5px; margin-bottom: 15px; padding: 10px; font-size: 14px; color:white; border:none; border-radius:6px; cursor:pointer;">Gegevens ophalen uit Google Sheet</button>
        <div style="overflow-x: auto;">
            <table id="overzichtTable">
                <thead>
                    <tr>
                        <th>Datum / Tijd</th>
                        <th>Type</th>
                        <th>Hoeveelheid</th>
                        <th>Opmerking</th>
                        <th>Actie</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5">Klik op de knop hierboven om overzicht te laden.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxudGZYXVLm1vN1Wj4BZydsJCiDnzaEBC0BedDQpkvgNfGrcAZ_vszquiO4byM29_wQ/exec";
        let alleRijenData = [];

        window.onload = function() {
            laadOverzicht();
        };

        function dataOpslaan() {
            let type = document.getElementById('typeToediening').value;
            let hoeveelheid = document.getElementById('hoeveelheid').value;
            let opmerking = document.getElementById('opmerking').value;
            let rowIndex = document.getElementById('editRowIndex').value;
            let bestaandeDatum = document.getElementById('oorspronkelijkeDatum').value;

            if (!hoeveelheid) {
                alert("Vul de hoeveelheid of dosering in!");
                return;
            }

            let nu = new Date();
            let datumTijdStr = bestaandeDatum ? bestaandeDatum : 
                String(nu.getDate()).padStart(2, '0') + '-' + 
                String(nu.getMonth() + 1).padStart(2, '0') + '-' + 
                nu.getFullYear() + ' ' + 
                String(nu.getHours()).padStart(2, '0') + ':' + 
                String(nu.getMinutes()).padStart(2, '0');

            let data = {
                sheetName: "Toedieningen",
                DatumTijd: datumTijdStr,
                Type: type,
                Hoeveelheid: hoeveelheid,
                Opmerking: opmerking
            };

            if (rowIndex) {
                data.rowIndex = rowIndex;
            }

            alert("Bezig met opslaan...");

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert("Succesvol opgeslagen!");
                annuleerBewerken();
                document.getElementById('hoeveelheid').value = "";
                document.getElementById('opmerking').value = "";
                setTimeout(laadOverzicht, 1500);
            })
            .catch(error => {
                console.error('Fout:', error);
                alert("Er ging iets mis bij het opslaan.");
            });
        }

        function laadOverzicht() {
            fetch(SCRIPT_URL + "?action=getData&sheet=Toedieningen")
            .then(response => response.json())
            .then(result => {
                if (result.status === "success" && result.data.length > 0) {
                    alleRijenData = result.data;
                    let tbody = document.getElementById('tableBody');
                    tbody.innerHTML = "";
                    
                    let rows = [...result.data].reverse();

                    rows.forEach(row => {
                        let schoneDatum = row.DatumTijd || '';
                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${schoneDatum}</td>
                            <td>${row.Type || ''}</td>
                            <td>${row.Hoeveelheid || ''}</td>
                            <td>${row.Opmerking || ''}</td>
                            <td><button class="btn-edit" onclick="laadRijVoorBewerking(${row.rowIndex})">Bewerk</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            })
            .catch(err => {
                console.error("Kon overzicht niet laden", err);
            });
        }

        function laadRijVoorBewerking(rowIndex) {
            let rij = alleRijenData.find(r => r.rowIndex == rowIndex);
            if (!rij) return;

            document.getElementById('editRowIndex').value = rij.rowIndex;
            document.getElementById('oorspronkelijkeDatum').value = rij.DatumTijd;
            document.getElementById('typeToediening').value = rij.Type || 'Zoutoplossing / NaCl';
            document.getElementById('hoeveelheid').value = rij.Hoeveelheid || '';
            document.getElementById('opmerking').value = rij.Opmerking || '';

            document.getElementById('bewerkModeBanner').style.display = 'block';
            document.getElementById('opslaanBtn').innerText = "Wijzigingen Opslaan";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function annuleerBewerken() {
            document.getElementById('editRowIndex').value = "";
            document.getElementById('oorspronkelijkeDatum').value = "";
            document.getElementById('bewerkModeBanner').style.display = 'none';
            document.getElementById('opslaanBtn').innerText = "Opslaan naar Google Sheet";
            document.getElementById('hoeveelheid').value = "";
            document.getElementById('opmerking').value = "";
        }
    </script>

</body>
</html>
