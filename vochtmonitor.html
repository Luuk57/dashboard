<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuukData - Gewicht & UF Monitor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        h2, h3 {
            color: #0066cc;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        .result-box {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
        }
        .uf-green { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .uf-orange { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .uf-red { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .uf-blue { background-color: #cce5ff; color: #004085; border: 1px solid #b8daff; }

        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #004fa3;
        }
        .btn-secondary {
            background-color: #28a745;
        }
        .btn-secondary:hover {
            background-color: #218838;
        }
        .btn-edit {
            background-color: #ffc107;
            color: #333;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            margin: 0;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #0066cc;
            color: white;
        }
        #bewerkModeBanner {
            background-color: #fff3cd;
            color: #856404;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💧 Gewicht, Vocht & UF Monitor</h2>
        
        <div id="bewerkModeBanner">
            Bewerkmodus actief (Rij wordt bijgewerkt) <button onclick="annuleerBewerken()" style="padding: 2px 5px; font-size: 12px; width: auto; background: #dc3545; margin-top:0;">Annuleer</button>
        </div>

        <input type="hidden" id="editRowIndex" value="">
        <input type="hidden" id="oorspronkelijkeDatum" value="">

        <div class="form-group">
            <label for="dryWeight">Droog gewicht (kg):</label>
            <input type="number" step="0.1" id="dryWeight" oninput="slaDroogGewichtOp(); berekenAlles();">
        </div>

        <div class="form-group">
            <label for="preWeight">Pre-gewicht vóór dialyse (kg):</label>
            <input type="number" step="0.1" id="preWeight" placeholder="Bijv. 112.5" oninput="berekenAlles()">
        </div>

        <div id="ufAdviesBox" class="result-box uf-green">
            Berekende UF Advies: <span id="ufAdviesOutput">0.0</span> kg
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label for="postWeight">Nagewicht ná dialyse (kg):</label>
            <input type="number" step="0.1" id="postWeight" placeholder="Bijv. 109.2" oninput="berekenAlles()">
        </div>

        <div id="echteUfBox" class="result-box uf-blue">
            Echte UF (Pre - Nagewicht): <span id="echteUfOutput">0.0</span> kg
        </div>

        <button id="opslaanBtn" onclick="dataOpslaan()">Opslaan naar Google Sheet</button>

        <a href="index.html" class="back-link">← Terug naar Hoofdmenu</a>
    </div>

    <div class="container">
        <h3>📊 Geschiedenis & Overzicht</h3>
        <button onclick="laadOverzicht()" class="btn-secondary" style="margin-top: 5px; margin-bottom: 15px; padding: 10px; font-size: 14px;">Gegevens ophalen uit Google Sheet</button>
        <div style="overflow-x: auto;">
            <table id="overzichtTable">
                <thead>
                    <tr>
                        <th>Datum / Tijd</th>
                        <th>Droog</th>
                        <th>Pre</th>
                        <th>Advies</th>
                        <th>Na</th>
                        <th>Echte UF</th>
                        <th>Actie</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7">Klik op de knop hierboven om overzicht te laden.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxudGZYXVLm1vN1Wj4BZydsJCiDnzaEBC0BedDQpkvgNfGrcAZ_vszquiO4byM29_wQ/exec";
        let alleRijenData = [];

        window.onload = function() {
            let opgeslagenDroog = localStorage.getItem('luuk_droog_gewicht') || "109";
            document.getElementById('dryWeight').value = opgeslagenDroog;
            laadOverzicht();
        };

        function slaDroogGewichtOp() {
            let dry = document.getElementById('dryWeight').value;
            if(dry) {
                localStorage.setItem('luuk_droog_gewicht', dry);
            }
        }

        function berekenAlles() {
            let pre = parseFloat(document.getElementById('preWeight').value) || 0;
            let dry = parseFloat(document.getElementById('dryWeight').value) || 109;
            let post = parseFloat(document.getElementById('postWeight').value) || 0;
            
            let ufAdvies = pre > 0 ? (pre - dry + 0.3) : 0;
            if (ufAdvies < 0) ufAdvies = 0;

            let adviesSpan = document.getElementById('ufAdviesOutput');
            let adviesBox = document.getElementById('ufAdviesBox');
            adviesSpan.innerText = ufAdvies.toFixed(2);

            adviesBox.className = "result-box";
            if (ufAdvies >= 4.5) {
                adviesBox.classList.add('uf-red');
            } else if (ufAdvies >= 4.0) {
                adviesBox.classList.add('uf-orange');
            } else {
                adviesBox.classList.add('uf-green');
            }

            let echteUf = (pre > 0 && post > 0) ? (pre - post) : 0;
            if (echteUf < 0) echteUf = 0;
            document.getElementById('echteUfOutput').innerText = echteUf.toFixed(2);
        }

        function dataOpslaan() {
            let pre = document.getElementById('preWeight').value;
            let dry = document.getElementById('dryWeight').value;
            let post = document.getElementById('postWeight').value;
            let advies = document.getElementById('ufAdviesOutput').innerText;
            let echteUf = document.getElementById('echteUfOutput').innerText;
            let rowIndex = document.getElementById('editRowIndex').value;
            let bestaandeDatum = document.getElementById('oorspronkelijkeDatum').value;

            if (!pre) {
                alert("Vul ten minste het pre-gewicht in!");
                return;
            }

            // Maak een nette leesbare datum (bijv. 26-10-2026 19:45)
            let nu = new Date();
            let datumTijdStr = bestaandeDatum ? bestaandeDatum : 
                String(nu.getDate()).padStart(2, '0') + '-' + 
                String(nu.getMonth() + 1).padStart(2, '0') + '-' + 
                nu.getFullYear() + ' ' + 
                String(nu.getHours()).padStart(2, '0') + ':' + 
                String(nu.getMinutes()).padStart(2, '0');

            let data = {
                DatumTijd: datumTijdStr,
                DroogGewicht: dry,
                PreGewicht: pre,
                UFAdvies: advies,
                Nagewicht: post || "",
                EchteUF: post ? echteUf : ""
            };

            if (rowIndex) {
                data.rowIndex = rowIndex;
            }

            alert("Bezig met opslaan...");

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert("Succesvol opgeslagen!");
                annuleerBewerken();
                document.getElementById('preWeight').value = "";
                document.getElementById('postWeight').value = "";
                berekenAlles();
                setTimeout(laadOverzicht, 1500);
            })
            .catch(error => {
                console.error('Fout:', error);
                alert("Er ging iets mis bij het opslaan.");
            });
        }

        function laadOverzicht() {
            fetch(SCRIPT_URL + "?action=getData")
            .then(response => response.json())
            .then(result => {
                if (result.status === "success" && result.data.length > 0) {
                    alleRijenData = result.data;
                    let tbody = document.getElementById('tableBody');
                    tbody.innerHTML = "";
                    
                    let rows = [...result.data].reverse();

                    rows.forEach(row => {
                        // Formateer eventuele oude ISO datums naar leesbaar formaat voor de weergave
                        let schoneDatum = row.DatumTijd || '';
                        if (schoneDatum.includes('T') && schoneDatum.endsWith('Z')) {
                            let d = new Date(schoneDatum);
                            if (!isNaN(d)) {
                                schoneDatum = String(d.getDate()).padStart(2, '0') + '-' + 
                                             String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                                             d.getFullYear() + ' ' + 
                                             String(d.getHours()).padStart(2, '0') + ':' + 
                                             String(d.getMinutes()).padStart(2, '0');
                            }
                        }

                        let tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${schoneDatum}</td>
                            <td>${row.DroogGewicht || ''}</td>
                            <td>${row.PreGewicht || ''}</td>
                            <td>${row.UFAdvies || ''}</td>
                            <td>${row.Nagewicht || ''}</td>
                            <td>${row.EchteUF || ''}</td>
                            <td><button class="btn-edit" onclick="laadRijVoorBewerking(${row.rowIndex})">Bewerk</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            })
            .catch(err => {
                console.error("Kon overzicht niet laden", err);
            });
        }

        function laadRijVoorBewerking(rowIndex) {
            let rij = alleRijenData.find(r => r.rowIndex == rowIndex);
            if (!rij) return;

            document.getElementById('editRowIndex').value = rij.rowIndex;
            document.getElementById('oorspronkelijkeDatum').value = rij.DatumTijd;
            document.getElementById('dryWeight').value = rij.DroogGewicht || 109;
            document.getElementById('preWeight').value = rij.PreGewicht || '';
            document.getElementById('postWeight').value = rij.Nagewicht || '';

            document.getElementById('bewerkModeBanner').style.display = 'block';
            document.getElementById('opslaanBtn').innerText = "Wijzigingen Opslaan";
            
            berekenAlles();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function annuleerBewerken() {
            document.getElementById('editRowIndex').value = "";
            document.getElementById('oorspronkelijkeDatum').value = "";
            document.getElementById('bewerkModeBanner').style.display = 'none';
            document.getElementById('opslaanBtn').innerText = "Opslaan naar Google Sheet";
            document.getElementById('preWeight').value = "";
            document.getElementById('postWeight').value = "";
            berekenAlles();
        }
    </script>

</body>
</html>
