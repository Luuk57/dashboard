<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuukData - Dialyse Countdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-top: 10px;
            margin-bottom: 20px;
        }
        h2, h3 {
            color: #bb86fc;
            margin-top: 0;
            text-align: center;
        }
        .timer-display {
            font-size: 42px;
            font-weight: bold;
            font-family: monospace;
            color: #03dac6;
            margin: 15px 0;
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            letter-spacing: 2px;
            text-align: center;
        }
        .status-text {
            font-size: 16px;
            color: #b0b0b0;
            margin-bottom: 15px;
            text-align: center;
        }
        .settings-box {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 3px;
        }
        input[type="time"], input[type="number"] {
            width: 100%;
            padding: 8px;
            background: #3d3d3d;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #bb86fc;
            color: #121212;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn:hover { background-color: #9965f4; }
        .btn-secondary {
            background-color: #03dac6;
        }
        .btn-secondary:hover { background-color: #02b3a2; }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #bb86fc;
            text-decoration: none;
            font-weight: bold;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h2>⏱️ Dialyse Countdown</h2>
        <div class="status-text" id="statusText">Laden...</div>
        
        <div class="timer-display" id="timerOutput">00:00:00</div>

        <!-- Schema Instellingen -->
        <div class="settings-box">
            <h3>⚙️ Tijden Schema</h3>
            <div class="form-group">
                <label for="startTime">Starttijd:</label>
                <input type="time" id="startTime" value="22:30">
            </div>
            <div class="form-group">
                <label for="endTime">Eindtijd (volgende ochtend):</label>
                <input type="time" id="endTime" value="05:30">
            </div>
            <button class="btn" onclick="slaTijdenOp()">Schema Opslaan</button>
        </div>

        <!-- Handmatige Timer Instelling -->
        <div class="settings-box">
            <h3>🖐️ Handmatige Timer</h3>
            <div class="form-group">
                <label for="manualHours">Aantal uren handmatig:</label>
                <input type="number" id="manualHours" min="0" max="12" value="7">
            </div>
            <div class="form-group">
                <label for="manualMinutes">Aantal minuten handmatig:</label>
                <input type="number" id="manualMinutes" min="0" max="59" value="0">
            </div>
            <button class="btn btn-secondary" onclick="startHandmatigeTimer()">Start Handmatige Timer</button>
            <button class="btn" style="background-color: #cf6679; color:white; margin-top:5px;" onclick="resetHandmatigeTimer()">Terug naar Schema</button>
        </div>

        <a href="index.html" class="back-link">← Terug naar Hoofdmenu</a>
    </div>

    <script>
        let handmatigEindTijd = null;

        window.onload = function() {
            let opgeslagenStart = localStorage.getItem('luuk_start_tijd');
            let opgeslagenEind = localStorage.getItem('luuk_eind_tijd');

            if (opgeslagenStart) document.getElementById('startTime').value = opgeslagenStart;
            if (opgeslagenEind) document.getElementById('endTime').value = opgeslagenEind;

            setInterval(updateCountdown, 1000);
            updateCountdown();
        };

        function slaTijdenOp() {
            let start = document.getElementById('startTime').value;
            let eind = document.getElementById('endTime').value;
            if (start && eind) {
                localStorage.setItem('luuk_start_tijd', start);
                localStorage.setItem('luuk_eind_tijd', eind);
                handmatigEindTijd = null; // Terug naar schema
                alert("Schema opgeslagen!");
            }
        }

        function startHandmatigeTimer() {
            let uren = parseInt(document.getElementById('manualHours').value) || 0;
            let minuten = parseInt(document.getElementById('manualMinutes').value) || 0;
            
            let totaalMs = (uren * 3600 + minuten * 60) * 1000;
            if (totaalMs <= 0) {
                alert("Vul een geldig aantal uren of minuten in!");
                return;
            }

            handmatigEindTijd = new Date().getTime() + totaalMs;
            alert("Handmatige timer gestart!");
        }

        function resetHandmatigeTimer() {
            handmatigEindTijd = null;
            alert("Teruggeschakeld naar het vaste schema.");
        }

        function updateCountdown() {
            let now = new Date();
            let statusText = document.getElementById('statusText');
            let timerOutput = document.getElementById('timerOutput');
            let targetTime = new Date(now);

            // Als er een handmatige timer loopt
            if (handmatigEindTijd) {
                let diff = handmatigEindTijd - now.getTime();
                if (diff <= 0) {
                    timerOutput.innerText = "00:00:00";
                    statusText.innerText = "Handmatige timer is afgelopen!";
                    return;
                }
                formatteerEnToon(diff, "Handmatige Countdown:", timerOutput, statusText);
                return;
            }

            // Anders via het schema (Start- en Eindtijd)
            let startVal = document.getElementById('startTime').value;
            let eindVal = document.getElementById('endTime').value;
            if (!startVal || !eindVal) return;

            let [startUur, startMin] = startVal.split(':').map(Number);
            let [eindUur, eindMin] = eindVal.split(':').map(Number);

            let currentTimeInSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            let startSeconds = startUur * 3600 + startMin * 60;
            let endSeconds = eindUur * 3600 + eindMin * 60;

            let isTijdensDialyse = false;

            if (startSeconds > endSeconds) {
                // Loopt over middernacht heen (bijv. 22:30 tot 05:30)
                if (currentTimeInSeconds >= startSeconds) {
                    targetTime.setDate(targetTime.getDate() + 1);
                    targetTime.setHours(eindUur, eindMin, 0, 0);
                    isTijdensDialyse = true;
                } else if (currentTimeInSeconds < endSeconds) {
                    targetTime.setHours(eindUur, eindMin, 0, 0);
                    isTijdensDialyse = true;
                } else {
                    targetTime.setHours(startUur, startMin, 0, 0);
                    isTijdensDialyse = false;
                }
            } else {
                // Binnen dezelfde dag
                if (currentTimeInSeconds >= startSeconds && currentTimeInSeconds < endSeconds) {
                    targetTime.setHours(eindUur, eindMin, 0, 0);
                    isTijdensDialyse = true;
                } else {
                    if (currentTimeInSeconds >= endSeconds) targetTime.setDate(targetTime.getDate() + 1);
                    targetTime.setHours(startUur, startMin, 0, 0);
                    isTijdensDialyse = false;
                }
            }

            let diff = targetTime - now;
            if (diff <= 0) {
                timerOutput.innerText = "00:00:00";
                statusText.innerText = isTijdensDialyse ? "Dialytijd bereikt / afgelopen!" : "Tijd om te starten!";
                return;
            }

            let label = isTijdensDialyse ? "Actieve Dialyse - Tijd tot einde:" : "Wachten op starttijd:";
            formatteerEnToon(diff, label, timerOutput, statusText);
        }

        function formatteerEnToon(diff, label, timerOutput, statusText) {
            let diffHours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            let diffMinutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            let diffSeconds = Math.floor((diff % (1000 * 60)) / 1000);

            let formattedTime = 
                String(diffHours).padStart(2, '0') + ':' + 
                String(diffMinutes).padStart(2, '0') + ':' + 
                String(diffSeconds).padStart(2, '0');

            timerOutput.innerText = formattedTime;
            statusText.innerText = label;
        }
    </script>

</body>
</html>
